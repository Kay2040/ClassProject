
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="../css/ca.css">
</head>
<body>

    <header>

        <div class="container nav">

            <div class="logo">

                <i class="fa-solid fa-water"></i>

                <span>Aqua Shop</span>

            </div>

            <ul class="menu">

                <li>
                    <a href="index.html"
                       class="active">
                        Cá ngọt
                    </a>
                </li>

                <li>
                    <a href="ca-man.html">
                        Cá mặn
                    </a>
                </li>

                <li>
                    <a href="lien-he.html">
                        Liên hệ
                    </a>
                </li>

                <li>
                    <a href="lab.html">
                        Lab thực hành
                    </a>
                </li>

            </ul>

            <div class="cart">

                <i class="fa-solid fa-cart-shopping"></i>

            </div>

        </div>

    </header>

    <section class="hero freshwater">

        <i class="fa-solid fa-fish hero-icon"></i>

        <h1>Cá Cảnh Nước Ngọt</h1>

        <p>
            Vẻ đẹp thanh tao của thiên nhiên
        </p>

    </section>


    <section class="products container">

        <div class="section-title">

            <h2>Danh sách cá cảnh</h2>

        </div>

        <div class="product-grid">

            <div class="card">

                <img src="https://images.unsplash.com/photo-1524704654690-b56c05c78a00?q=80&w=1000"
                     alt="">

                <div class="card-body">

                    <h3>Cá Betta</h3>

                    <p>
                        Cá betta đẹp với màu sắc nổi bật.
                    </p>

                    <div class="card-footer">

                        <span>250.000 đ</span>

                        <button>
                            Thêm
                        </button>

                    </div>

                </div>

            </div>

            <div class="card">

                <img src="https://images.unsplash.com/photo-1544551763-46a013bb70d5?q=80&w=1000"
                     alt="">

                <div class="card-body">

                    <h3>Cá Guppy</h3>

                    <p>
                        Loài cá nhỏ dễ nuôi cho người mới.
                    </p>

                    <div class="card-footer">

                        <span>45.000 đ</span>

                        <button>
                            Thêm
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
